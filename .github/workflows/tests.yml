name: Python checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]" pytest-asyncio
      - name: Unit coverage
        run: pytest --cov=studio --cov-branch --cov-report=term-missing --cov-fail-under=100
