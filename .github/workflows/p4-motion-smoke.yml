name: P4 IK prop-contact video smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "studio/motion.py"
      - "tests/test_motion.py"
      - "examples/p4_coffee_motion.json"
      - "runtime/contact*"
      - ".github/workflows/p4-motion-smoke.yml"
jobs:
  contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install P4 dependencies
        run: |
          pip install -e .
          cd runtime
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx esbuild contact_scene.mjs --bundle --format=esm --outfile=contact_scene.bundle.js
      - name: Compile contact script, validate constraints
        run: |
          mkdir -p runtime/fixtures
          python scripts/compile_motion.py examples/p4_coffee_motion.json runtime/fixtures/contact_frames.json
          python - <<'PY'
          import json, math
          f=json.load(open("runtime/fixtures/contact_frames.json"))["frames"]
          assert len(f)==48
          assert f[12]["prop_state"]=="held" and f[-1]["prop_state"]=="free"
          assert f[47]["prop"]=={"x":250.0,"y":207.0}
          for pose in f:
              if pose["prop_state"]=="held":
                  assert pose["prop"]==pose["hand"]
              shoulder=pose["shoulder"]; elbow=pose["elbow"]; hand=pose["hand"]
              assert abs(math.dist(shoulder.values(),elbow.values())-90)<0.0001
              assert abs(math.dist(elbow.values(),hand.values())-80)<0.0001
          print("P4 strict IK & contact invariants passed")
          PY
      - name: Render 48 deterministic PNG frames
        run: node runtime/contact_render.mjs
      - name: Encode short MP4 through FFmpeg
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -i outputs/p4/frames/frame_%06d.png -c:v libx264 -pix_fmt yuv420p outputs/p4/p4_coffee_contact.mp4
          ffprobe -v error -show_entries stream=nb_frames,width,height -of json outputs/p4/p4_coffee_contact.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-ik-contact-demo
          path: outputs/p4/
