name: P2 real Genielabs rig pipeline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/run_rig_pipeline.py"
      - "scripts/p2_synthetic_fixture.py"
      - "studio/rigging.py"
      - ".github/workflows/p2-genielabs-integration.yml"
jobs:
  synthetic-rig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rig image processing
        run: pip install -e ".[rig]"
      - name: Fetch pinned Genielabs scripts
        run: |
          mkdir -p vendor/genielabs/scripts
          SHA=702b71689cac826efee942ee4564fef9560d6ef8
          for name in split_character.py position_parts.py build_spine_json.py make_atlas.py; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/GenielabsOpenSource/spine-animation-ai/$SHA/scripts/$name" -o "vendor/genielabs/scripts/$name"
          done
      - name: Create source character sheet fixture
        run: python scripts/p2_synthetic_fixture.py
      - name: Generate real Spine rig from fixture
        run: |
          python scripts/run_rig_pipeline.py \
            --genielabs vendor/genielabs \
            --atlas outputs/p2_fixture/parts_atlas.png \
            --reference outputs/p2_fixture/reference.png \
            --workspace outputs/p2_fixture/rig \
            --semantic outputs/p2_fixture/semantic.json \
            --anchors outputs/p2_fixture/anchors.json \
            --from-stage 1
      - name: Assert output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("outputs/p2_fixture/rig")
          rig=json.loads((root/"skeleton.json").read_text())
          names=[b["name"] for b in rig["bones"]]
          assert len(names)==len(set(names)),names
          assert "torso" in names and "head" in names,names
          assert all(n in rig["animations"] for n in ["idle","walk","run"])
          assert (root/"skeleton.png").is_file()
          assert (root/"skeleton.atlas").is_file()
          print("P2 synthetic rig contract passed",names,list(rig["animations"]))
          PY
      - name: Render newly generated P2 rig in actual Spine Player
        run: |
          mkdir -p runtime/fixtures
          cp outputs/p2_fixture/rig/skeleton.json runtime/fixtures/sombrero.json
          cp outputs/p2_fixture/rig/skeleton.atlas runtime/fixtures/sombrero.atlas
          cp outputs/p2_fixture/rig/skeleton.png runtime/fixtures/skeleton.png
          cp outputs/p2_fixture/rig/skeleton.png runtime/fixtures/sombrero.png
          cd runtime
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          cd ..
          node runtime/smoke.mjs
          cp outputs/p0_spine_frame.png outputs/p2_fixture/generated_rig_browser.png
          python scripts/check_render_nonblank.py outputs/p2_fixture/generated_rig_browser.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-synthetic-genielabs-rig
          path: outputs/p2_fixture/
