name: P5 P6 v2 independent multi-shot film
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "studio/film_v2.py"
      - "scripts/prepare_film_v2.py"
      - "runtime/film_v2*"
      - "examples/p6_v2_*"
      - "scripts/p6_v2_fixture_assets.py"
      - "tests/test_film_v2.py"
      - ".github/workflows/p6-v2-independent-shots.yml"
jobs:
  independent-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python, renderer and headless Chromium
        run: |
          pip install -e .
          cd runtime
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx esbuild film_v2_scene.mjs --bundle --format=esm --outfile=film_v2_scene.bundle.js
      - name: Download pinned Genielabs rig builder
        run: |
          mkdir -p vendor/genielabs/scripts
          SHA=702b71689cac826efee942ee4564fef9560d6ef8
          for script in build_spine_json.py make_atlas.py; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/GenielabsOpenSource/spine-animation-ai/$SHA/scripts/$script" -o "vendor/genielabs/scripts/$script"
          done
      - name: Generate two independently rigged Spine characters and image assets
        run: |
          for variant in baseline compact; do
            python scripts/p4_spine_fixture.py --genielabs vendor/genielabs --out "outputs/p6_v2/rig_$variant" --variant "$variant"
            mkdir -p "runtime/fixtures/$variant"
            cp "outputs/p6_v2/rig_$variant/skeleton.json" "outputs/p6_v2/rig_$variant/skeleton.atlas" "outputs/p6_v2/rig_$variant/skeleton.png" "outputs/p6_v2/rig_$variant/rig_profile.json" "runtime/fixtures/$variant/"
          done
          python scripts/p6_v2_fixture_assets.py
      - name: Compile five independent shots without stretching a source motion
        run: |
          python scripts/prepare_film_v2.py examples/p6_v2_film.json examples/p6_v2_catalog.json examples/p6_v2_motions.json runtime/fixtures
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("runtime/fixtures")
          timeline=json.loads((root/"film_timeline.json").read_text())
          motions=json.loads((root/"film_motions.json").read_text())
          assert timeline["total_frames"]==672 and len(timeline["shots"])==5
          assert [s["start"] for s in timeline["shots"]]==[0,96,240,384,528]
          assert len(motions)==5
          assert len({s["motion_ids"][0] for s in timeline["shots"]})==5
          assert {a["rig_id"] for f in timeline["frames"] for a in f["actors"]}=={"baseline","compact"}
          assert {f["background_id"] for f in timeline["frames"]}=={"cafe_morning","cafe_evening"}
          for shot in timeline["shots"]:
            for frame in timeline["frames"][shot["start"]:shot["end_exclusive"]]:
              actor=frame["actors"][0]
              assert frame["local_frame"]==actor["pose_frame"]
              assert len(motions[actor["motion_id"]]["frames"])==shot["end_exclusive"]-shot["start"]
          print("P5: five DIFFERENT action clips and asset-bound shots PASS")
          PY
      - name: Assemble exact audio sample map (synthetic WAV fixture only)
        run: |
          python scripts/p6_fixture_voice.py
          python scripts/assemble_voice.py runtime/fixtures/film_timeline.json outputs/p6_demo/voices outputs/p6_v2/narration.wav outputs/p6_v2/audio_manifest.json
          python - <<'PY'
          import json,wave
          m=json.load(open("outputs/p6_v2/audio_manifest.json"))
          assert len(m["segments"])==5 and m["sample_count"]==672000
          assert [x["start_frame"] for x in m["segments"]]==[8,102,246,392,536]
          with wave.open("outputs/p6_v2/narration.wav","rb") as wav:
            assert wav.getnframes()==672000 and wav.getframerate()==24000
          print("P6 audio alignment: 672000 PCM samples / 28s PASS")
          PY
      - name: Render full 5-shot / 672-frame film with actual Spine bones
        run: node runtime/film_v2_render.mjs
      - name: Encode final H264/AAC movie and inspect video/audio metadata
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -i outputs/p6_v2/frames/frame_%06d.png -i outputs/p6_v2/narration.wav -map 0:v:0 -map 1:a:0 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -c:a aac -b:a 96k outputs/p6_v2/five_independent_shots_28s.mp4
          python - <<'PY'
          import subprocess,json
          from pathlib import Path
          p="outputs/p6_v2/five_independent_shots_28s.mp4"
          meta=json.loads(subprocess.check_output(["ffprobe","-v","error","-count_frames","-show_entries","format=duration:stream=codec_type,codec_name,width,height,avg_frame_rate,nb_read_frames","-of","json",p]))
          tracks={s["codec_type"]:s for s in meta["streams"]}
          assert set(tracks)=={"video","audio"}
          assert tracks["video"]["nb_read_frames"]=="672"
          assert tracks["video"]["avg_frame_rate"]=="24/1"
          assert tracks["video"]["width"]==640 and tracks["video"]["height"]==480
          assert tracks["video"]["codec_name"]=="h264" and tracks["audio"]["codec_name"]=="aac"
          assert abs(float(meta["format"]["duration"])-28)<0.06
          assert Path(p).stat().st_size>15000
          print("P6 V2 DONE: 5 independent shots, 2 rigs, 2 backgrounds, 672 frames, 28s H264/AAC")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-v2-five-independent-shot-film
          path: |
            outputs/p6_v2/*.mp4
            outputs/p6_v2/*.json
            outputs/p6_v2/previews/*.png
            runtime/fixtures/film_timeline.json
            runtime/fixtures/film_motions.json
